name: Publish Newspaper site
on:
  workflow_dispatch:
    inputs:
      version:
        description: SHA-256 of the origin site manifest
        required: true
        type: string
      request_id:
        description: Identifier from the VPS publication request
        required: true
        type: string
permissions: {}
concurrency:
  group: newspaper-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/fetch-pages-artifact.py
        env:
          NEWSPAPER_ORIGIN: ${{ vars.NEWSPAPER_ORIGIN }}
          NEWSPAPER_VERSION: ${{ inputs.version }}
          NEWSPAPER_REQUEST_ID: ${{ inputs.request_id }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
