# Public reusable editorial configuration; no credentials.
[[editions]]
id = "technology-politics"
name = "科技与政治日报"
sections = ["ai", "space", "hardware", "digital", "communications", "materials", "energy", "science", "politics"]

[[editions]]
id = "acgn"
name = "ACGN 日报"
sections = ["gacha", "galgame", "games", "game-community", "anime", "acgn-community"]

[[sections]]
id = "ai"
name = "人工智能"
scope = "最新重要模型发布及能力与限制，AI 公司重大动作，前沿研究和开源技术，中文及外文社区有信息价值的热点；区分官方评测、独立测试与体验。"
batch = "tech"
enabled = true

[[sections]]
id = "space"
name = "航天宇航"
scope = "重大发射与任务结果、重大技术突破、中国航天和中国商业航天的重要进展、社区热点。严格区分计划、发射、入轨和任务完成。"
batch = "tech"
enabled = true

[[sections]]
id = "hardware"
name = "硬件"
scope = "尖端制程、计算与存储芯片、架构封装互连的重大进展和重要新品。区分流片、样片、量产、出货和实测。"
batch = "tech"
enabled = true

[[sections]]
id = "digital"
name = "数码"
scope = "手机、平板、电脑、相机、无人机、机器人等消费电子重要新品；交代定位、实质变化、价格、地区与上市时间。排除配色及轻微更新。"
batch = "industry"
enabled = true

[[sections]]
id = "communications"
name = "信息与通信"
scope = "仅重大突破或重大事件，影响通信能力、基础设施、标准或大量用户；普通行业动态不报道。"
batch = "industry"
enabled = true

[[sections]]
id = "materials"
name = "材料"
scope = "仅重大突破或重大事件；区分实验、样品、中试与规模应用，不把潜力写成已经商业化。"
batch = "science"
enabled = true

[[sections]]
id = "energy"
name = "能源"
scope = "仅重大突破或重大事件；效率成本寿命等参数注明测试条件，区分实验纪录、示范与商业运行。"
batch = "science"
enabled = true

[[sections]]
id = "science"
name = "基础学科"
scope = "物理、化学、数学、生物等有真实影响的基础突破；面向普通本科生详细解释问题、背景、方法、新结果、意义及局限。注明论文评审、复现、证明状态；不得仅凭摘要断言突破。"
batch = "science"
enabled = true

[[sections]]
id = "politics"
name = "政治"
scope = "仅国际重大政治事件；中性事实报道，区分事实、各方表态、指控与预测；争议按证据处理，注明统计口径，不推测动机、不夹带立场。"
batch = "politics"
enabled = true

[[sections]]
id = "gacha"
name = "二游"
scope = "国内外以抽卡为核心的二次元游戏新发布与重大版本。介绍工作室、发行商、玩法、世界观、平台语言地区日期商业模式；排除常规卡池和小活动。"
batch = "games"
enabled = true

[[sections]]
id = "galgame"
name = "Galgame"
scope = "日本、中国及其他地区 Galgame 重要新作或重大版本。介绍公司工作室、题材故事设定与玩法、平台语言地区日期商业模式，避免剧透。"
batch = "games"
enabled = true

[[sections]]
id = "games"
name = "其他热门新作"
scope = "单机、独立、网游、音游等重要新作或重大版本；介绍公司工作室、玩法设定、平台语言地区日期商业模式。区分公布、测试、抢先体验和正式发行。"
batch = "games"
enabled = true

[[sections]]
id = "game-community"
name = "热门游戏事件与热梗"
scope = "近期出圈、具有代表性或实质影响的游戏事件及热梗；说明起因经过背景和梗的含义，玩家观点不等于事实，不传播无据指控。"
batch = "culture"
enabled = true

[[sections]]
id = "anime"
name = "新番播出与情报"
scope = "值得报道的新番开播及重要制作播出情报，说明原作题材、制作公司主创、时间平台地区限制；必须查找可追溯的社区评价，区分正片评价、预告期待和原作评价；样本不足如实说明。"
batch = "culture"
enabled = true

[[sections]]
id = "acgn-community"
name = "其他 ACGN 事件与社区热点"
scope = "动画、漫画、轻小说、同人及二次元文化的重要事件和有信息价值的社区热点；排除例行宣传、轻微争论、八卦。"
batch = "culture"
enabled = true
