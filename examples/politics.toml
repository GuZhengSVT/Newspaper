# Optional standalone politics project. Copy to a private project file to use it,
# or merge its group and sections into your own project and homepage.groups.
# Official releases establish a party's position; disputed claims need independent evidence.
[project]
name = "Newspaper"
timezone = "UTC"

[schedule]
period = "daily"
time = "12:00"

[homepage]
mode = "groups"
layout = "tabs"
layout_switch = true
groups = ["politics"]

[[groups]]
id = "politics"
name = "政治"
sections = ["politics-china", "politics-us", "politics-europe", "politics-russia-ukraine", "politics-middle-east", "politics-south-america", "politics-africa", "politics-other"]

[[sections]]
id = "politics-china"
name = "中国"
scope = "仅收录重大或重要政治事件。中性事实报道，区分事实、各方表态、指控与预测；不推测动机。中国重大内政、立法、公共政策及外交事件。俄乌战争和中东冲突相关外交进展归入对应专题，避免重复。"
enabled = true

[sections.search]
queries = []
languages = ["zh", "en"]
domains = ["reuters.com", "apnews.com", "gov.cn", "npc.gov.cn", "news.cn"]

[sections.filter]
importance = ["重大", "重要"]
reliability = ["A", "B"]
require_primary = false

[sections.prompts]
plan = "先读已配信源，再按地域与事件缺口补查；优先核对官方原文及路透社、美联社等独立报道。"
select = "严格按 scope 归类，同一事件只收入最相关子板块；俄乌战争、中东专题优先。"
edit = "官方及参战方主张必须归因；争议数据注明口径与核实状态。"
review = "核对归类、重复收录、事实与声明的区分及争议证据。"

