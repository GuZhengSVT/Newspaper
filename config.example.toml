# Runtime configuration. Copy alongside project.local.toml outside Git.
project_file = "project.local.toml"
data_dir = "/var/lib/newspaper"
web_dir = "/srv/newspaper"
base_url = "http://127.0.0.1"
retention_days = 30

[model]
provider = "compatible"
id = "YOUR_MODEL"
base_url = "https://api.example.com/v1"
api_key_env = "NEWSPAPER_API_KEY"
timeout_seconds = 180
max_tokens = 12000

[search]
mode = "bounded"
engines = ["bing", "keenable", "exa"]
max_candidates_per_edition = 12
max_fetches_per_edition = 24
timeout_seconds = 35

[notifications.email]
enabled = false
[notifications.telegram]
enabled = false
